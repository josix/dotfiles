# Guake-style dropdown terminal for kitty.
# Toggle with: kitten quick-access-terminal
# macOS hotkey: System Settings -> Keyboard -> Keyboard Shortcuts ->
#   Services -> General -> "Quick access to kitty"

# Drop down from the top edge of the screen, Guake style.
edge top

# Height of the dropdown, in terminal lines.
lines 25

background_opacity 0.9

# Hide the window when it loses focus, like Guake.
hide_on_focus_loss yes
